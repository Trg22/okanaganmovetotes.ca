<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictures | Okanagan Move Totes</title>
    <meta name="description" content="Gallery of our reusable moving totes in action.">
    <style>
        body { font-family: system-ui; margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, #f5a800 0%, #ffa600 100%); padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        nav { display: flex; gap: 30px; }
        nav a { color: white; text-decoration: none; font-weight: 500; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 40px; }
        .gallery-item { background: #e9e9e9; border-radius: 8px; aspect-ratio: 3/2; display: flex; align-items: center; justify-content: center; font-size: 32px; }
        footer { background: #333; color: white; padding: 20px; text-align: center; }
    </style>
</head>
<body>
<header>
    <h2>🟦 Okanagan Move Totes - Gallery</h2>
    <nav>
        <a href="/">Home</a>
        <a href="/pictures">Pictures</a>
    </nav>
</header>

<section class="gallery">
    <div class="gallery-item">📦</div>
    <div class="gallery-item">🚚</div>
    <div class="gallery-item">♻️</div>
    <div class="gallery-item">✅</div>
    <div class="gallery-item">👥</div>
    <div class="gallery-item">🎯</div>
</section>

<footer>
    <p>&copy; 2026 Okanagan Move Totes</p>
</footer>
</body>
</html>
